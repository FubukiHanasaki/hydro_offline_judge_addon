<div class="row" id="offline-app" data-api="{{ offlineApi }}" data-batches="{{ offlineBatchBase }}" data-selected="{{ offlineSelected }}">
  <div class="medium-9 columns">
    <div class="section">
      <div class="section__body">
        <input id="oj-contest" type="hidden" value="{{ offlineSelected }}"><div class="oj-competition-line"><button id="oj-refresh" class="link" type="button">刷新</button></div>
        <div id="oj-notice" role="alert" hidden></div>
        <form id="oj-upload" class="oj-toolbar">
          <label class="oj-grow">代码包<input id="oj-file" type="file" accept=".zip,application/zip" required></label>
          <label class="oj-language-field">提交语言<select id="oj-language" class="select" required><option value="">请选择语言</option></select></label>
          <button id="oj-preview" class="primary rounded button" type="submit"><span class="icon icon-search"></span> 上传并预览</button>
        </form>
        <div class="oj-inline-links"><button id="oj-format" class="link" type="button" aria-expanded="false">打包格式</button></div>
        <div id="oj-format-body" class="oj-format" hidden><pre>src.zip
└─ src/（可省略）
   ├─ 张三/
   │  ├─ candy/candy.cpp
   │  └─ tree/tree.cpp
   └─ 李四/
      └─ candy/candy.cpp</pre></div>
      </div>
    </div>
    <section class="section" id="oj-preview-section" hidden>
      <div class="section__header"><h2 class="section__title" id="oj-batch-title">导入预览</h2><div class="section__tools"><span id="oj-state" class="oj-badge"></span></div></div>
      <div class="section__body">
        <div id="oj-summary" class="oj-summary"></div><div id="oj-mapping" hidden></div>
        <p id="oj-job-error" class="oj-error" role="alert" hidden></p>
        <div class="oj-table-wrap"><table class="data-table"><thead><tr><th>选手</th><th>题目 / 文件</th><th>语言</th><th>检查 / 评测</th><th>分数</th></tr></thead><tbody id="oj-rows"></tbody></table></div><div id="oj-mobile-rows" class="oj-mobile-list"></div>
      </div>
      <div class="section__body oj-actions" id="oj-actions">
        <label id="oj-consent-wrap"><input id="oj-consent" type="checkbox"> 确认本批为最终正式代码，确认后不能再次上传</label>
        <div class="oj-action-buttons"><button id="oj-cancel" class="rounded button" type="button">取消预览</button><button id="oj-resume" class="rounded button" type="button" hidden>检查并继续原批次</button><button id="oj-confirm" class="primary rounded button" type="button" disabled>确认导入并评测</button></div>
      </div>
    </section>
    <section class="section"><div class="section__header"><h2 class="section__title">导入记录</h2></div><div class="section__body" id="oj-history">加载中…</div></section>
  </div>
  <aside class="medium-3 columns">
    <div class="section side"><div class="section__header"><h2 class="section__title">题目</h2></div><div class="section__body" id="oj-problems">加载中…</div></div>
  </aside>
</div>
